<!DOCTYPE html>
<html lang="bn">
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f8;
  color: #202123;
}

header {
  height: 65px;
  background: #ffffff;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 22px;
  font-weight: bold;
  color: #7657d5;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 18px;
}

h3 {
  text-align: center;
  font-size: 25px;
  margin: 20px 0;
}

#chat {
  height: 65vh;
  min-height: 350px;
  overflow-y: auto;
  padding: 15px 5px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  background: #ffffff;
  padding: 15px 18px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.7;
  box-shadow: 0 2px 8px #0000000a;
  overflow-wrap: anywhere;
}

.message.user {
  background: #e9e2ff;
  align-self: flex-end;
}

form {
  display: flex;
  gap: 10px;
  background: white;
  padding: 10px;
  border: 1px solid #dddddd;
  border-radius: 18px;
  box-shadow: 0 3px 15px #0000000d;
}

input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 12px;
  font-size: 16px;
}

button {
  background: #7657d5;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

@media (max-width: 600px) {
  main {
    padding: 15px 12px;
  }

  #chat {
    height: 65vh;
  }

  .message {
    max-width: 95%;
  }
}
  </style>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya AI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header
  <header>
  <button id="menuBtn" type="button">☰</button>
  <span>✨ Maya AI</span>
  <button id="newChatBtn" type="button">＋ New Chat</button>
</header>

<aside id="sidebar">
  <h3>Maya AI</h3>
  <button id="sidebarNewChat" type="button">＋ New Chat</button>
  <p>Recent Chats</p>
  <div id="history"></div>
</aside>{
  padding: 20px;
  background: #17243a;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}
main {
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
}
#chat {
  height: 55vh;
  overflow-y: auto;
  background: #1b2940;
  border-radius: 12px;
  padding: 15px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #293b56;
  white-space: pre-wrap;
}
.user { background: #245b70; }
form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 9px;
  border: 0;
}
button {
  padding: 12px 18px;
  border: 0;
  border-radius: 9px;
  background: #38bdf8;
  font-weight: bold;
}
</style>
</head>
<body>
<header>✨ Maya AI</header>
<main>
  <h3>তোমাকে স্বাগতম!</h3>
  <div id="chat">
    <div class="message">Maya AI: আসসালামু আলাইকুম! আমি Maya AI। তোমাকে কীভাবে সাহায্য করতে পারি?</div>
  </div>
  <form id="form">
    <input id="question" placeholder="এখানে প্রশ্ন লেখো..." required>
    <button type="submit">Send</button>
  </form>
</main>
<script>
const MAYA_SERVER = "https://maya-ai-server.ahalihaider963.workers.dev/";

const form = document.getElementById("form");
const chat = document.getElementById("chat");
const input = document.getElementById("question");
const button = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const question = input.value.trim();
  if (!question) return;

  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.textContent = "তুমি: " + question;
  chat.appendChild(userMsg);

  const reply = document.createElement("div");
  reply.className = "message";
  reply.textContent = "Maya AI: উত্তর তৈরি করছি...";
  chat.appendChild(reply);

  input.value = "";
  button.disabled = true;
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(MAYA_SERVER, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || "AI connection failed");
    }

    reply.textContent = "Maya AI: " + data.answer;

  } catch (error) {
    reply.textContent = "Maya AI: দুঃখিত, সংযোগে সমস্যা হয়েছে। " + error.message;
  } finally {
    button.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
});
</script>
</body>
</html>
