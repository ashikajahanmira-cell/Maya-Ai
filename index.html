<!DOCTYPE html>
<html lang="bn">
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f7f8;
  color: #202123;
}

header {
  height: 65px;
  background: #ffffff;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  padding: 0 20px;
  font-size: 22px;
  font-weight: bold;
  color: #7657d5;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 25px 18px;
}

h3 {
  text-align: center;
  font-size: 25px;
  margin: 20px 0;
}

#chat {
  height: 65vh;
  min-height: 350px;
  overflow-y: auto;
  padding: 15px 5px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.message {
  background: #ffffff;
  padding: 15px 18px;
  border-radius: 18px;
  max-width: 85%;
  line-height: 1.7;
  box-shadow: 0 2px 8px #0000000a;
  overflow-wrap: anywhere;
}

.message.user {
  background: #e9e2ff;
  align-self: flex-end;
}

form {
  display: flex;
  gap: 10px;
  background: white;
  padding: 10px;
  border: 1px solid #dddddd;
  border-radius: 18px;
  box-shadow: 0 3px 15px #0000000d;
}

input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  padding: 12px;
  font-size: 16px;
}

button {
  background: #7657d5;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 15px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
}

@media (max-width: 600px) {
  main {
    padding: 15px 12px;
  }

  #chat {
    height: 65vh;
  }

  .message {
    max-width: 95%;
  }
}
    header {
  position: relative;
  z-index: 10;
  justify-content: space-between;
  gap: 12px;
}

#menuBtn {
  font-size: 22px;
  padding: 8px 13px;
}

#newChatBtn {
  font-size: 14px;
  padding: 10px 14px;
}

#sidebar {
  position: fixed;
  top: 65px;
  left: 0;
  bottom: 0;
  width: 270px;
  background: #ffffff;
  border-right: 1px solid #ddd;
  padding: 20px;
  z-index: 9;
  transform: translateX(-100%);
  transition: transform 0.25s ease;
  overflow-y: auto;
}

#sidebar.open {
  transform: translateX(0);
}

#sidebar h3 {
  color: #7657d5;
}

#sidebar p {
  color: #888;
  font-size: 14px;
}

#sidebarNewChat {
  width: 100%;
}

#history {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.historyItem {
  padding: 10px;
  border-radius: 10px;
  background: #f1f1f5;
  font-size: 14px;
  cursor: pointer;
  overflow-wrap: anywhere;
}

@media (max-width: 600px) {
  #sidebar {
    width: 80%;
    max-width: 290px;
  }
}
    body.dark {
  background: #121212;
  color: #eeeeee;
}

body.dark header,
body.dark #sidebar {
  background: #1e1e1e;
  color: #ffffff;
  border-color: #383838;
}

body.dark .message {
  background: #252525;
  color: #ffffff;
}

body.dark .message.user {
  background: #45366c;
}

body.dark form {
  background: #252525;
  border-color: #444444;
}

body.dark input {
  background: transparent;
  color: #ffffff;
}

body.dark .historyItem {
  background: #333333;
  color: #ffffff;
}

body.dark #sidebar p {
  color: #bbbbbb;
}
  </style>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya AI</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}
header{
  padding: 20px;
  background: #17243a;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
}
main {
  max-width: 600px;
  margin: 25px auto;
  padding: 15px;
}
#chat {
  height: 55vh;
  overflow-y: auto;
  background: #1b2940;
  border-radius: 12px;
  padding: 15px;
}
.message {
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  background: #293b56;
  white-space: pre-wrap;
}
.user { background: #245b70; }
form {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 9px;
  border: 0;
}
button {
  padding: 12px 18px;
  border: 0;
  border-radius: 9px;
  background: #38bdf8;
  font-weight: bold;
}
</style>
</head>
<body>
<header>
  <button id="menuBtn" type="button">☰</button>
  <span>✨ Maya AI</span>
  <button id="newChatBtn" type="button">＋ New Chat</button>
  <button id="darkModeBtn" type="button">🌙</button>
</header>

<aside id="sidebar">
  <h3>Maya AI</h3>
  <button id="sidebarNewChat" type="button">＋ New Chat</button>
  <p>Recent Chats</p>
  <div id="history"></div>
</aside>
<main>
  <h3>তোমাকে স্বাগতম!</h3>
  <div id="chat">
    <div class="message">Maya AI: আসসালামু আলাইকুম! আমি Maya AI। তোমাকে কীভাবে সাহায্য করতে পারি?</div>
  </div>
  <form id="form">
    <input id="question" placeholder="এখানে প্রশ্ন লেখো..." required>
   <button type="button" id="voiceBtn">🎤</button>
    <button type="submit">Send</button>
  </form>
</main>
<script>
const MAYA_SERVER = "https://maya-ai-server.ahalihaider963.workers.dev/";

const form = document.getElementById("form");
const chat = document.getElementById("chat");
const input = document.getElementById("question");
const button = form.querySelector('button[type="submit"]');

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  const question = input.value.trim();
  if (!question) return;

  const userMsg = document.createElement("div");
  userMsg.className = "message user";
  userMsg.textContent = "তুমি: " + question;
  chat.appendChild(userMsg);

  const reply = document.createElement("div");
  reply.className = "message";
  reply.textContent = "Maya AI: উত্তর তৈরি করছি...";
  chat.appendChild(reply);

  input.value = "";
  button.disabled = true;
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch(MAYA_SERVER, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: question
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.details || data.error || "AI connection failed");
    }

    reply.textContent = "Maya AI: " + data.answer;
    mayaSpeak(data.answer);

  } catch (error) {
    reply.textContent = "Maya AI: দুঃখিত, সংযোগে সমস্যা হয়েছে। " + error.message;
  } finally {
    button.disabled = false;
    chat.scrollTop = chat.scrollHeight;
  }
});
  const sidebar = document.getElementById("sidebar");
const menuBtn = document.getElementById("menuBtn");
const newChatBtn = document.getElementById("newChatBtn");
const sidebarNewChat = document.getElementById("sidebarNewChat");
const historyBox = document.getElementById("history");

menuBtn.addEventListener("click", () => {
  sidebar.classList.toggle("open");
});

function startNewChat() {
  mayaSaveHistory();
  mayaCurrentChatId = String(Date.now());
  const messages = chat.querySelectorAll(".message");

  messages.forEach(message => {
    message.remove();
  });

  const welcome = document.createElement("div");
  welcome.className = "message";
  welcome.textContent =
    "Maya AI: আসসালামু আলাইকুম! নতুন কথোপকথনে স্বাগতম। কী জানতে চাও?";
  chat.appendChild(welcome);

  input.value = "";
  sidebar.classList.remove("open");
  input.focus();
}

newChatBtn.addEventListener("click", startNewChat);
sidebarNewChat.addEventListener("click", startNewChat);
// Maya AI Chat History
const MAYA_HISTORY_KEY = "mayaChatHistory";
let mayaCurrentChatId = String(Date.now());

function mayaGetHistory() {
  try {
    return JSON.parse(localStorage.getItem(MAYA_HISTORY_KEY)) || [];
  } catch {
    return [];
  }
}

function mayaSaveHistory() {
  const messages = [...chat.querySelectorAll(".message")].map(m => ({
    className: m.classList.contains("user") ? "message user" : "message",
    text: m.textContent
  }));

  if (!messages.length) return;

  const firstUser = messages.find(m => m.className.includes("user"));
  const title = firstUser
    ? firstUser.text.replace("তুমি: ", "").slice(0, 35)
    : "নতুন কথোপকথন";

  let history = mayaGetHistory();
  const existing = history.findIndex(item => item.id === mayaCurrentChatId);

  const item = {
    id: mayaCurrentChatId,
    title,
    messages
  };

  if (existing >= 0) history[existing] = item;
  else history.unshift(item);

  history = history.slice(0, 20);
  localStorage.setItem(MAYA_HISTORY_KEY, JSON.stringify(history));
  mayaRenderHistory();
}

function mayaRenderHistory() {
  historyBox.innerHTML = "";

  mayaGetHistory().forEach(item => {
    const div = document.createElement("div");
    div.className = "historyItem";
    div.textContent = item.title;

    div.addEventListener("click", () => {
      mayaSaveHistory();
      mayaCurrentChatId = item.id;
      chat.innerHTML = "";

      item.messages.forEach(m => {
        const el = document.createElement("div");
        el.className = m.className;
        el.textContent = m.text;
        chat.appendChild(el);
      });

      sidebar.classList.remove("open");
    });

    historyBox.appendChild(div);
  });
}

const mayaHistoryObserver = new MutationObserver(mayaSaveHistory);
mayaHistoryObserver.observe(chat, {
  childList: true,
  subtree: true,
  characterData: true
});

mayaRenderHistory();
  // Maya AI Voice Input
const mayaVoiceBtn = document.getElementById("voiceBtn");

const MayaSpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (MayaSpeechRecognition) {
  const mayaRecognition = new MayaSpeechRecognition();

  mayaRecognition.lang = "bn-BD";
  mayaRecognition.continuous = false;
  mayaRecognition.interimResults = false;

  mayaVoiceBtn.addEventListener("click", () => {
    mayaVoiceBtn.textContent = "🔴 শুনছি...";
    mayaRecognition.start();
  });

  mayaRecognition.onresult = (event) => {
    input.value = event.results[0][0].transcript;
    mayaVoiceBtn.textContent = "🎤";
    input.focus();
  };

  mayaRecognition.onerror = () => {
    mayaVoiceBtn.textContent = "🎤";
    alert("মাইক্রোফোন চালু হচ্ছে না। আবার চেষ্টা করো।");
  };

  mayaRecognition.onend = () => {
    mayaVoiceBtn.textContent = "🎤";
  };

} else {
  mayaVoiceBtn.addEventListener("click", () => {
    alert("তোমার ব্রাউজারে Voice Input সমর্থিত নয়। Chrome ব্যবহার করে চেষ্টা করো।");
  });
}
  // Maya AI Voice Reply
function mayaSpeak(text) {
  if (!("speechSynthesis" in window)) {
    alert("তোমার ব্রাউজারে Voice Reply সমর্থিত নয়।");
    return;
  }

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = "bn-BD";
  speech.rate = 1;
  speech.pitch = 1;

  window.speechSynthesis.speak(speech);
}
</script>
</body>
</html>
